# Configuration Render (Blueprint) — PackFlow Predict API
services:
  - type: web
    name: packflow-predict-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python packflow_predict.py --entrainer
    startCommand: gunicorn packflow_predict:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300
    healthCheckPath: /api/sante
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PACKFLOW_API_KEY
        generateValue: true
